# Test Application Properties
# This configuration is used during test execution

# Application Name
spring.application.name=gearup-backend-test

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable Spring Boot Banner in Tests
spring.main.banner-mode=off

# JWT Test Configuration  
# Base64 encoded secret (decoded: "test-secret-key-for-jwt-token-generation-in-tests-must-be-at-least-256-bits-long")
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1pbi10ZXN0cy1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=
jwt.expiration=3600000
jwt.refresh.expiration=7200000
jwt.email_verification.expiration=300000

# Email Configuration (Disabled in tests)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@gearup.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Email Verification (Enabled for tests to verify email sending behavior)
app.email.verification.enabled=true

# Disable Admin Initialization in Tests
app.admin.init.enabled=false
app.admin.email=admin@gearup.com
app.admin.password=Admin@123
app.admin.name=System Administrator

# Base URLs for Testing
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000

# Swagger (Disabled in tests)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# GraphQL Configuration
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false

# Logging Configuration
logging.level.root=WARN
logging.level.com.ead.gearup=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Disable Redis in tests (if not available)
spring.data.redis.repositories.enabled=false
spring.cache.type=none

# WebFlux Configuration
spring.webflux.base-path=/

